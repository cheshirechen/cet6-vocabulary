<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的六级单词本</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f0;color:#23332e;font:16px/1.65 system-ui,sans-serif}main{max-width:1140px;margin:auto;padding:32px 18px}h1{font-size:38px;margin:0}small,.muted{color:#64736d}header{border-bottom:1px solid #d6ded8;padding-bottom:16px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}input,select,button{font:inherit;padding:9px;border:1px solid #b9ccc1;border-radius:8px;background:white;color:inherit}input{flex:1;min-width:160px}button{cursor:pointer}button[aria-pressed=true]{background:#245d50;color:white}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;align-items:stretch}article{background:white;border:1px solid #d6ded8;border-radius:12px;padding:18px;overflow-wrap:anywhere;display:flex;flex-direction:column}h2{font:700 30px/1.2 Georgia,serif;margin:0;color:#203a30}.head,.related-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.related{margin:5px 0 0;padding-left:12px;border-left:2px solid #bfcec2}.related-word{font:600 25px/1.25 Georgia,serif;color:#375b4d;text-decoration:none}.related-gloss{display:block;font-size:14px;color:#52655a;margin-top:1px}.ipa{font-size:15px;color:#667870;line-height:1.4;margin:5px 0 8px}.sound{padding:4px 8px;display:inline-flex;align-items:center;gap:4px;font-size:13px;color:#45665b;border-color:#d2dfd6;background:#f6faf7}.sound svg{width:16px;height:16px}.detail{margin-top:5px}.sense{display:grid;grid-template-columns:4.2em 1fr;gap:4px;align-items:baseline;margin:9px 0}.pos{font:italic 600 15px Georgia,serif;color:#45665b}.sense-text{font-size:16px}.forms{font-size:14px;margin:7px 0;color:#566b60}.conf{background:#fff1dc;padding:8px;border-radius:6px;font-size:14px;margin:10px 0}.source{display:block;margin-top:auto;padding-top:10px;font-size:13px}.dictlink{font-size:14px;margin-top:6px;color:#245d50;text-decoration:underline;text-underline-offset:3px}.hidden article:not(.reveal) .detail,.hidden article:not(.reveal) .related-gloss,.hidden article:not(.reveal) .forms{visibility:hidden}.hidden article{cursor:pointer}footer{margin-top:24px}.status{font-size:13px;color:#52655a;min-height:1.2em}button:focus-visible,a:focus-visible,article:focus-visible{outline:2px solid #245d50;outline-offset:3px}@media(max-width:600px){h1{font-size:30px}.tools select{max-width:100%}.sense{grid-template-columns:3.7em 1fr}}
</style></head><body><main><header><small>CET-6 / PERSONAL VOCABULARY</small><h1>我的六级单词本</h1><p>仅收录已确认的黄色高亮词汇。</p><small>英式音标与中文释义为学习性归纳；查询入口统一为剑桥英汉简体词典，尚未逐条核验所有释义和音标。</small></header><div class="tools"><input id="q" type="search" placeholder="搜索英文、中文、易混词" aria-label="搜索"><select id="source" aria-label="真题出处"><option value="">全部真题</option></select><button id="conf" aria-pressed="false">仅易混词</button><button id="hide" aria-pressed="false">隐藏释义</button></div><p id="count" aria-live="polite"></p><div id="cards"></div><p id="status" class="status" role="status"></p><footer class="muted">后续按真题追加；同词合并出处，不重复建卡。</footer></main>
<script src="vocabulary.js"></script><script>
const $=id=>document.getElementById(id),data=window.VOCAB||[],cards=$('cards');
for(const s of new Set(data.flatMap(x=>x.sources))){const o=document.createElement('option');o.value=o.textContent=s;$('source').append(o)}
function el(tag,txt,cls){const x=document.createElement(tag);x.textContent=txt;if(cls)x.className=cls;return x}
const dict=w=>'https://dictionary.cambridge.org/dictionary/english-chinese-simplified/'+encodeURIComponent(w.toLowerCase().replace(/ /g,'-'));
function say(word){if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){$('status').textContent='当前浏览器不支持朗读，请使用词典页面的发音按钮。';return}const synth=window.speechSynthesis;try{synth.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-GB';const voices=synth.getVoices(),voice=voices.find(v=>v.lang.toLowerCase()==='en-gb')||voices.find(v=>v.lang.toLowerCase().startsWith('en'));if(voice)u.voice=voice;u.rate=.92;u.onerror=e=>{if(!['canceled','interrupted'].includes(e.error))$('status').textContent='朗读暂不可用，请检查设备语音设置或使用词典发音。'};u.onstart=()=>{$('status').textContent='正在朗读：'+word};u.onend=()=>{$('status').textContent=''};synth.speak(u)}catch(e){$('status').textContent='朗读暂不可用，请使用词典发音。'}}
function audio(word,label='朗读'){const b=el('button','','sound');b.type='button';b.setAttribute('aria-label',label+' '+word);b.title=label+' '+word;b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15 9a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12"/></svg>';b.append(document.createTextNode(label));b.onclick=e=>{e.stopPropagation();say(word)};return b}
function link(word,label,cls){const a=el('a',label,cls);a.href=dict(word);a.target='_blank';a.rel='noopener noreferrer';return a}
function sense(line){const p=el('div','','sense');const m=line.match(/^((?:phr\. v\.|prep\. phr\.|v\. phr\.|[a-z]+\.))\s+(.*)$/);p.append(el('span',m?m[1]:'','pos'),el('span',m?m[2]:line,'sense-text'));return p}
function render(){const q=$('q').value.toLowerCase().trim(),s=$('source').value,c=$('conf').getAttribute('aria-pressed')==='true';const list=data.filter(x=>(!s||x.sources.includes(s))&&(!c||x.confusion)&&JSON.stringify(x).toLowerCase().includes(q));$('count').textContent=list.length+' / '+data.length+' 个已确认词条';cards.replaceChildren();
for(const x of list){const a=el('article','');a.tabIndex=0;const h=el('div','','head');h.append(el('h2',x.word));if(x.word==='attribute'){h.append(audio('to attribute','动词'),audio('an attribute','名词'))}else{h.append(audio(x.word))}a.append(h);
for(const r of x.roots||[]){const box=el('div','','related');const rh=el('div','','related-head');rh.append(link(r.word,r.word,'related-word'),audio(r.word));box.append(rh);if(r.ipa)box.append(el('div','/'+r.ipa+'/','ipa'));box.append(el('div',r.meaning,'related-gloss'));a.append(box)}
a.append(el('div',x.word==='attribute'?'英 /əˈtrɪbjuːt/ (v.) · /ˈætrɪbjuːt/ (n.)':'英 /'+x.ipa+'/','ipa'));
if(x.forms)a.append(el('div',x.forms,'forms'));
const d=el('div','','detail');for(const line of Array.isArray(x.meaning)?x.meaning:[x.meaning])d.append(sense(line));if(x.confusion){const p=el('div','','conf');p.append(el('strong','易混词　'),document.createTextNode(x.confusion));d.append(p)}a.append(d,el('small',x.sources.join('；'),'source muted'),link(x.dict||x.word,'剑桥英汉词典查询','dictlink'));
a.addEventListener('click',e=>{if(!e.target.closest('a,button')&&cards.classList.contains('hidden'))a.classList.toggle('reveal')});a.addEventListener('keydown',e=>{if(e.target===a&&['Enter',' '].includes(e.key)){e.preventDefault();a.click()}});cards.append(a)}if(!list.length)cards.append(el('p','没有匹配词条。'))}
$('q').oninput=render;$('source').onchange=render;for(const id of ['conf','hide']){$(id).onclick=()=>{const b=$(id),v=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(v));if(id==='hide'){cards.classList.toggle('hidden',v);b.textContent=v?'显示释义':'隐藏释义'}render()}}render();
</script></body></html>
