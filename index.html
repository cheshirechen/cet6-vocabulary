function render(){const q=$('q').value.toLowerCase().trim(),s=$('source').value,c=$('conf').getAttribute('aria-pressed')==='true';const list=data.filter(x=>(!s||x.sources.includes(s))&&(!c||x.confusion)&&JSON.stringify(x).toLowerCase().includes(q));const order=$('order').value;if(order!=='added')list.sort((a,b)=>(order==='az'?1:-1)*a.word.localeCompare(b.word,'en',{sensitivity:'base'}));$('count').textContent=list.length+' / '+data.length+' 个已确认词条';cards.replaceChildren();
for(const x of list){const a=el('article','');a.tabIndex=0;const h=el('div','','head');h.append(el('h2',x.word));if(x.word==='attribute'){h.append(audio('to attribute','动词'),audio('an attribute','名词'))}else{h.append(audio(x.word))}a.append(h);if(x.ipa)a.append(el('div',x.word==='attribute'?'英 /əˈtrɪbjuːt/ (v.) · /ˈætrɪbjuːt/ (n.)':'英 /'+x.ipa+'/','ipa main-ipa'));
for(const r of x.roots||[]){const box=el('div','','related');const rh=el('div','','related-head');rh.append(link(r.word,r.word,'related-word'),audio(r.word));box.append(rh);if(r.ipa)box.append(el('div','/'+r.ipa+'/','ipa'));box.append(el('div',r.meaning,'related-gloss'));a.append(box)}

if(x.forms)a.append(el('div',x.forms,'forms'));
const d=el('div','','detail');if(x.senses?.length){const groups=new Map();for(const s of x.senses){if(!groups.has(s.pos))groups.set(s.pos,[]);groups.get(s.pos).push(s)}for(const [pos,items] of groups){const g=el('section','','sense-group');g.append(el('div',pos,'pos'));items.forEach((s,i)=>{const p=el('div','','sense');p.append(el('span','（'+(i+1)+'）','sense-no'),el('span','('+s.en+') ','sense-en'),el('span',s.zh,'sense-zh'));const ex=el('div','','example');ex.append(el('div',s.ex),el('div',s.translation,'example-zh'));p.append(ex);g.append(p)});d.append(g)}}else{for(const line of Array.isArray(x.meaning)?x.meaning:[x.meaning])d.append(sense(line));}if(x.confusion){const p=el('div','','conf');p.append(el('strong','易混词　'),document.createTextNode(x.confusion));d.append(p)}a.append(d,el('small',x.sources.join('；'),'source muted'),link(x.dict||x.word,'剑桥英汉词典查询','dictlink'));
a.addEventListener('click',e=>{if(!e.target.closest('a,button')&&cards.classList.contains('hidden'))a.classList.toggle('reveal')});a.addEventListener('keydown',e=>{if(e.target===a&&['Enter',' '].includes(e.key)){e.preventDefault();a.click()}});cards.append(a)}if(!list.length)cards.append(el('p','没有匹配词条。'))}
$('q').oninput=render;$('source').onchange=render;$('order').onchange=render;for(const id of ['conf','hide']){$(id).onclick=()=>{const b=$(id),v=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(v));if(id==='hide'){cards.classList.toggle('hidden',v);b.textContent=v?'显示释义':'隐藏释义'}render()}}render();
</script></body></html>
