<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的六级单词本</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f0;color:#23332e;font:16px/1.65 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px 18px}h1{font-size:38px;margin:0}small,.muted{color:#64736d}header{border-bottom:1px solid #d6ded8;padding-bottom:16px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}input,select,button{font:inherit;padding:9px;border:1px solid #b9ccc1;border-radius:8px;background:white;color:inherit}input{flex:1;min-width:160px}button{cursor:pointer}button[aria-pressed=true]{background:#245d50;color:white}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}article{background:white;border:1px solid #d6ded8;border-radius:12px;padding:18px;overflow-wrap:anywhere}h2{font:700 27px Georgia,serif;margin:0 0 8px}p{margin:8px 0}b{color:#45665b;font-size:13px}a{color:#245d50}.conf{background:#fff1dc;padding:8px;border-radius:6px}.hidden article:not(.reveal) .detail{visibility:hidden}.hidden article{cursor:pointer}footer{margin-top:24px}@media(max-width:600px){h1{font-size:30px}} </style></head><body><main><header><small>CET-6 / PERSONAL VOCABULARY</small><h1>我的六级单词本</h1><p>仅收录已确认的黄色高亮词汇；词根、底层词及易混词为附注。</p><small>中文释义为学习性归纳，尚未逐条核对牛津词典；每条附查询入口。</small></header><div class="tools"><input id="q" type="search" placeholder="搜索英文、中文、易混词" aria-label="搜索"><select id="source" aria-label="真题出处"><option value="">全部真题</option></select><button id="conf" aria-pressed="false">仅易混词</button><button id="hide" aria-pressed="false">隐藏释义</button></div><p id="count" aria-live="polite"></p><div id="cards"></div><footer class="muted">后续按真题追加；同词合并出处，不重复建卡。</footer></main><script src="vocabulary.js"></script><script>
const $=id=>document.getElementById(id), data=window.VOCAB||[], cards=$('cards'); for(const s of new Set(data.flatMap(x=>x.sources))){const o=document.createElement('option');o.value=o.textContent=s;$('source').append(o)}
function el(tag,txt,cls){const x=document.createElement(tag);x.textContent=txt;if(cls)x.className=cls;return x}
function render(){const q=$('q').value.toLowerCase().trim(),s=$('source').value,c=$('conf').getAttribute('aria-pressed')==='true';const list=data.filter(x=>(!s||x.sources.includes(s))&&(!c||x.confusion)&&JSON.stringify(x).toLowerCase().includes(q));$('count').textContent=list.length+' / '+data.length+' 个已确认词条';cards.replaceChildren();for(const x of list){const a=el('article','');a.tabIndex=0;a.append(el('h2',x.word));const d=el('div','','detail');for(const [label,val] of [['词义',x.meaning],['真题语境',x.context],['特殊变形',x.forms],['构词 / 底层词',x.root],['我的易混词',x.confusion]]){if(!val)continue;const p=el('p','',label==='我的易混词'?'conf':'');p.append(el('b',label+'　'),document.createTextNode(val));d.append(p)}a.append(d,el('small',x.sources.join('；'),'muted'));const link=el('a','牛津词典查询');link.href='https://www.oxfordlearnersdictionaries.com/search/english/?q='+encodeURIComponent(x.word);link.target='_blank';link.rel='noopener noreferrer';const p=el('p','');p.append(link);a.append(p);a.addEventListener('click',e=>{if(!e.target.closest('a')&&cards.classList.contains('hidden'))a.classList.toggle('reveal')});a.addEventListener('keydown',e=>{if(e.target===a&&['Enter',' '].includes(e.key)){e.preventDefault();a.click()}});cards.append(a)}if(!list.length)cards.append(el('p','没有匹配词条。'))}
$('q').oninput=render;$('source').onchange=render;for(const id of ['conf','hide']){$(id).onclick=()=>{const b=$(id),v=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(v));if(id==='hide'){cards.classList.toggle('hidden',v);b.textContent=v?'显示释义':'隐藏释义'}render()}}render();
</script></body></html>
