</script><script>
const $=id=>document.getElementById(id),data=window.VOCAB||[],cards=$('cards');
for(const s of new Set(data.flatMap(x=>x.sources))){const o=document.createElement('option');o.value=o.textContent=s;$('source').append(o)}
function el(tag,txt,cls){const x=document.createElement(tag);x.textContent=txt;if(cls)x.className=cls;return x}
const dict=w=>'https://dictionary.cambridge.org/dictionary/english-chinese-simplified/'+encodeURIComponent(w.toLowerCase().replace(/ /g,'-'));
function say(word){if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){$('status').textContent='当前浏览器不支持朗读，请使用词典页面的发音按钮。';return}const synth=window.speechSynthesis;try{synth.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-GB';const voices=synth.getVoices(),voice=voices.find(v=>v.lang.toLowerCase()==='en-gb')||voices.find(v=>v.lang.toLowerCase().startsWith('en'));if(voice)u.voice=voice;u.rate=.92;u.onerror=e=>{if(!['canceled','interrupted'].includes(e.error))$('status').textContent='朗读暂不可用，请检查设备语音设置或使用词典发音。'};u.onstart=()=>{$('status').textContent='正在朗读：'+word};u.onend=()=>{$('status').textContent=''};synth.speak(u)}catch(e){$('status').textContent='朗读暂不可用，请使用词典发音。'}}
function audio(word,label='朗读'){const b=el('button','','sound');b.type='button';b.setAttribute('aria-label',label+' '+word);b.title=label+' '+word;b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15 9a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12"/></svg>';b.append(document.createTextNode(label));b.onclick=e=>{e.stopPropagation();say(word)};return b}
function link(word,label,cls){const a=el('a',label,cls);a.href=dict(word);a.target='_blank';a.rel='noopener noreferrer';return a}
function sense(line){const p=el('div','','sense');const m=line.match(/^((?:phr\. v\.|prep\. phr\.|v\. phr\.|[a-z]+\.))\s+(.*)$/);p.append(el('span',m?m[1]:'','pos'),el('span',m?m[2]:line,'sense-text'));return p}
function render(){const q=$('q').value.toLowerCase().trim(),s=$('source').value,c=$('conf').getAttribute('aria-pressed')==='true';const list=data.filter(x=>(!s||x.sources.includes(s))&&(!c||x.confusion)&&JSON.stringify(x).toLowerCase().includes(q));const order=$('order').value;if(order!=='added')list.sort((a,b)=>(order==='az'?1:-1)*a.word.localeCompare(b.word,'en',{sensitivity:'base'}));$('count').textContent=list.length+' / '+data.length+' 个已确认词条';cards.replaceChildren();

for(const r of x.roots||[]){const box=el('div','','related');const rh=el('div','','related-head');rh.append(link(r.word,r.word,'related-word'),audio(r.word));box.append(rh);if(r.ipa)box.append(el('div','/'+r.ipa+'/','ipa'));box.append(el('div',r.meaning,'related-gloss'));if(!r.checked)box.append(el('small','附属词释义待进一步核对','related-gloss muted'));if(r.sourceUrl){const l=link(r.word,'英文词典依据','dictlink');l.href=r.sourceUrl;box.append(l)}if(r.etymology){const l=link(r.word,'词源依据','dictlink');l.href=r.etymology;box.append(l)}a.append(box)}

if(x.ipaNote)a.append(el('small',x.ipaNote,'muted'));if(x.forms)a.append(el('div',x.forms,'forms'));
const d=el('div','','detail');if(x.senses?.length){const groups=new Map();for(const s of x.senses){if(!groups.has(s.pos))groups.set(s.pos,[]);groups.get(s.pos).push(s)}for(const [pos,items] of groups){const g=el('section','','sense-group');g.append(el('div',pos,'pos'));items.forEach((s,i)=>{const p=el('div','','sense');p.append(el('span',i<20?String.fromCodePoint(0x2460+i):String(i+1)+'.','sense-no'),el('span','('+s.en+') ','sense-en'),el('span',s.zh,'sense-zh'));const ex=el('div','','example');ex.append(el('div',s.ex),el('div',s.translation,'example-zh'));if(s.exampleSource)ex.append(el('small',s.exampleSource,'muted'));p.append(ex);g.append(p)});d.append(g)}}else{for(const line of Array.isArray(x.meaning)?x.meaning:[x.meaning])d.append(sense(line));}if(x.confusion){const p=el('div','','conf');p.append(el('strong','易混词　'),document.createTextNode(x.confusion));d.append(p)}a.append(d,el('small',x.sources.join('；'),'source muted'));for(const path of x.dictionarySources||[x.dict||x.word])a.append(link(path,'剑桥英汉词典 · '+path.replace(/-/g,' '),'dictlink'));
a.addEventListener('click',e=>{if(!e.target.closest('a,button')&&cards.classList.contains('hidden'))a.classList.toggle('reveal')});a.addEventListener('keydown',e=>{if(e.target===a&&['Enter',' '].includes(e.key)){e.preventDefault();a.click()}});cards.append(a)}if(!list.length)cards.append(el('p','没有匹配词条。'))}
$('q').oninput=render;$('source').onchange=render;$('order').onchange=render;for(const id of ['conf','hide']){$(id).onclick=()=>{const b=$(id),v=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(v));if(id==='hide'){cards.classList.toggle('hidden',v);b.textContent=v?'显示释义':'隐藏释义'}render()}}render();
